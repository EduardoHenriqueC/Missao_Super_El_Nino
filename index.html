<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Guardiões do Clima</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #12202b;
            overflow: hidden;
            touch-action: none;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center
        }

        canvas {
            width: min(100vw, 177.7vh);
            height: auto;
            aspect-ratio: 16/9;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>
    <canvas id="c" width="960" height="540"></canvas>
    <script>
        const C = document.getElementById('c'), X = C.getContext('2d'), W = 960, H = 540, FONT = 'Verdana,Arial,sans-serif';
        const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0), kAct = isTouch ? 'Toque E' : 'Tecla E';
        let S = 'menu', L, keys = {}, pressed = {}, btns = [], fade = 1, T = 0, AC, P = [], FT = [], card = 0, introSlide = 0, G = { seeds: 0, leaks: 0, trees: 0, trash: 0, drains: 0, gardens: 0, barriers: 0, cisterns: 0 };
        const K = { l: ['ArrowLeft', 'KeyA'], r: ['ArrowRight', 'KeyD'], j: ['ArrowUp', 'KeyW', 'Space'], a: ['KeyE', 'Enter', 'KeyF'] };
        const gY3 = x => 480 - Math.sin(x / 200) * 60;

        let touches = {};
        const getTouch = e => { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
        C.addEventListener('pointerdown', e => { const p = getTouch(e); touches[e.pointerId] = p; for (const b of btns) if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) { b.f(); break } });
        C.addEventListener('pointermove', e => { if (touches[e.pointerId]) touches[e.pointerId] = getTouch(e); });
        C.addEventListener('pointerup', e => delete touches[e.pointerId]);
        C.addEventListener('pointercancel', e => delete touches[e.pointerId]);
        C.addEventListener('pointerout', e => delete touches[e.pointerId]);

        const vBtn = [{ k: 'l', x: 80, y: 460, r: 40, ic: '◀' }, { k: 'r', x: 180, y: 460, r: 40, ic: '▶' }, { k: 'a', x: W - 180, y: 460, r: 40, ic: 'E' }, { k: 'j', x: W - 80, y: 460, r: 40, ic: '⬆' }];
        let vheld = {}, vpress = {}, lastVheld = {};
        function updTouch() {
            if (!isTouch) return;
            vheld = {}; for (let b of vBtn) { for (let id in touches) { if (Math.hypot(touches[id].x - b.x, touches[id].y - b.y) < b.r * 1.5) vheld[b.k] = 1; } }
            for (let k of ['l', 'r', 'j', 'a']) { vpress[k] = vheld[k] && !lastVheld[k]; lastVheld[k] = vheld[k]; }
        }
        function drawTouch() {
            if (isTouch && ['p1', 'p2', 'p3'].includes(S)) {
                X.globalAlpha = 0.5;
                for (let b of vBtn) { X.beginPath(); X.arc(b.x, b.y, b.r, 0, 7); X.fillStyle = vheld[b.k] ? '#fff' : '#000'; X.fill(); X.lineWidth = 3; X.strokeStyle = '#fff'; X.stroke(); txt(b.ic, b.x, b.y + 2, 30, vheld[b.k] ? '#000' : '#fff', 'center', null) }
                X.globalAlpha = 1;
            }
        }

        addEventListener('keydown', e => { if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); if (!keys[e.code]) pressed[e.code] = 1; keys[e.code] = 1 });
        addEventListener('keyup', e => keys[e.code] = 0);

        const held = k => K[k].some(c => keys[c]) || vheld[k], press = k => K[k].some(c => pressed[c]) || vpress[k];

        function snd(f, d = .12, t = 'square', v = .06, s = 0) { try { AC = AC || new AudioContext(); const n = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = t; o.frequency.setValueAtTime(f, n); if (s) o.frequency.linearRampToValueAtTime(f + s, n + d); g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.001, n + d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(n + d) } catch (e) { } }
        const sSeed = () => { snd(660, .08, 'triangle', .08, 300) }, sFix = () => { snd(300, .1, 'square', .06, 200); setTimeout(() => snd(600, .15, 'triangle', .07), 90) }, sPlant = () => { [400, 500, 650, 800].forEach((f, i) => setTimeout(() => snd(f, .15, 'triangle', .08), i * 80)) }, sCool = () => snd(900, .2, 'sine', .05, -300), sBad = () => snd(150, .3, 'sawtooth', .06, -80), sThunder = () => snd(70, .8, 'sawtooth', .1, -40);
        function go(s) { S = s; fade = 1 }
        function txt(s, x, y, sz, col = '#fff', al = 'center', ol = '#0008') { X.font = 'bold ' + sz + 'px ' + FONT; X.textAlign = al; X.textBaseline = 'middle'; if (ol) { X.lineWidth = Math.max(2, sz / 8); X.strokeStyle = ol; X.lineJoin = 'round'; X.strokeText(s, x, y) } X.fillStyle = col; X.fillText(s, x, y) }
        function rr(x, y, w, h, r, f, s, lw = 3) { X.beginPath(); X.roundRect(x, y, w, h, r); if (f) { X.fillStyle = f; X.fill() } if (s) { X.strokeStyle = s; X.lineWidth = lw; X.stroke() } }
        function btn(t, x, y, w, h, fn, col = '#27ae60') { btns.push({ x, y, w, h, f: fn }); rr(x, y + 5, w, h, 16, '#0006'); rr(x, y, w, h, 16, col, '#0004', 2); txt(t, x + w / 2, y + h / 2, Math.min(30, h * .5), '#fff', 'center', '#00000044') }
        function wrap(s, x, y, mw, sz, col, lh, al = 'center') { X.font = 'bold ' + sz + 'px ' + FONT; let l = '', yy = y; for (const w of s.split(' ')) { const t = l ? l + ' ' + w : w; if (X.measureText(t).width > mw) { txt(l, x, yy, sz, col, al, null); l = w; yy += lh } else l = t } txt(l, x, yy, sz, col, al, null) }
        function burst(x, y, c, n = 12, g = 300) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = 60 + Math.random() * 140; P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, l: .7, m: .7, c, g, r: 3 + Math.random() * 3 }) } }
        function ft(s, x, y, c = '#fff') { FT.push({ s, x, y, l: 1.4, c }) }
        function shadow(x, y, oy, r) { const sc = Math.max(0, 1 - Math.abs(oy) / 8); X.fillStyle = 'rgba(0,0,0,0.25)'; X.beginPath(); X.ellipse(x, y, r * sc, r * 0.3 * sc, 0, 0, 7); X.fill() }
        function updFx(dt) { for (const p of P) { p.l -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt } P = P.filter(p => p.l > 0); for (const f of FT) { f.l -= dt; f.y -= 30 * dt } FT = FT.filter(f => f.l > 0) }
        function drawFx() { for (const p of P) { X.globalAlpha = Math.max(0, p.l / p.m); X.fillStyle = p.c; X.beginPath(); X.arc(p.x, p.y, p.r, 0, 7); X.fill() } X.globalAlpha = 1; for (const f of FT) { X.globalAlpha = Math.min(1, f.l); txt(f.s, f.x, f.y, 20, f.c); X.globalAlpha = 1 } }
        /* ---------- personagem ---------- */
        function drawP(p, t) {
            const b = p.on && Math.abs(p.vx) > 1 ? Math.sin(t * 16) * 2 : 0, x = p.x + 14, y = p.y + b; X.save(); X.translate(x, y); X.scale(p.d, 1);
            X.fillStyle = '#0003'; X.beginPath(); X.ellipse(0, 36 - b, 14, 4, 0, 0, 7); X.fill();
            rr(-12, 14, 24, 22, 8, '#2980b9', '#0008', 2); rr(-9, 34, 7, 6 + (Math.sin(t * 16) > 0 && b ? 2 : 0), 3, '#34495e', '#0008', 2); rr(2, 34, 7, 6 + (Math.sin(t * 16) < 0 && b ? 2 : 0), 3, '#34495e', '#0008', 2);
            X.fillStyle = '#ffd9b3'; X.beginPath(); X.arc(0, 8, 13, 0, 7); X.fill(); X.strokeStyle = '#0008'; X.lineWidth = 2; X.stroke();
            X.fillStyle = '#27ae60'; X.beginPath(); X.ellipse(-2, -4, 15, 7, 0, Math.PI, 0); X.fill(); X.stroke(); X.fillStyle = '#2ecc71'; X.beginPath(); X.ellipse(6, -9, 9, 4, -.6, 0, 7); X.fill(); X.stroke();
            X.fillStyle = '#222'; X.beginPath(); X.arc(5, 8, 2.5, 0, 7); X.arc(-3, 8, 2.5, 0, 7); X.fill(); X.restore();
            if (p.carry > 0) { txt(S == 'p3' ? '🌱' : '🗑️' + p.carry, x, p.y - 14, 18, '#fff', 'center', '#000a') }
        }
        function phys(p, dt, plats, sp, p3floor = false) {
            const m = (held('r') ? 1 : 0) - (held('l') ? 1 : 0); p.vx = m * sp; if (m) p.d = m;
            if (held('j') && p.on) { p.vy = -580; p.on = 0; snd(400, .1, 'square', .04, 300) }
            const pb = p.y + 36; p.vy += 1500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.on = 0;
            const floorY = p3floor ? gY3(p.x + 14) : 460;
            if (p.y + 36 >= floorY) { p.y = floorY - 36; p.vy = 0; p.on = 1 }
            for (const q of plats) if (p.vy >= 0 && pb <= q.y + 3 && p.y + 36 >= q.y && p.x + 24 > q.x && p.x < q.x + q.w) { p.y = q.y - 36; p.vy = 0; p.on = 1 }
            p.x = Math.max(0, Math.min(L.w - 28, p.x)); L.cx += ((p.x - W / 2 + 14) - L.cx) * Math.min(1, dt * 6); L.cx = Math.max(0, Math.min(L.w - W, L.cx))
        }
        const near = (x, r = 55) => Math.abs(L.p.x + 14 - x) < r;
        function bar(x, y, w, v, col, lab, ic) { rr(x, y, w, 22, 11, '#0007', '#fff', 2); if (v > 0) rr(x + 2, y + 2, Math.max(18, (w - 4) * Math.min(1, v)), 18, 9, col); txt(ic + ' ' + lab, x + w / 2, y + 11, 15, '#fff', 'center', '#000a') }
        function chip(x, y, w, t) { rr(x, y, w, 34, 17, '#0008', '#fff', 2); txt(t, x + w / 2, y + 17, 18, '#fff', 'center', null) }

        /* ---------- FASE 1 ---------- */
        function init1() {
            P = []; FT = [];
            L = {
                n: 1, w: 2600, cx: 0, t: 0, p: { x: 80, y: 424, vx: 0, vy: 0, on: 1, d: 1, heat: 15 }, seedN: 0, fixed: 0, planted: 0, win: 0, shade: 0,
                seeds: [300, 520, 780, 1000, 1300, 1580, 1900, 2200].map((x, i) => ({ x, y: i % 3 == 1 ? 385 : 460, got: 0 })),
                leaks: [450, 900, 1450, 2050].map(x => ({ x, f: 0, tm: 0 })), spots: [650, 1150, 1700, 2300, 2500].map(x => ({ x, d: 0 })), trees: []
            }; go('p1')
        }
        function upd1(dt) {
            const p = L.p; L.t += dt; phys(p, dt, [], p.heat >= 100 ? 110 : 230);
            for (const s of L.seeds) if (!s.got && near(s.x, 30) && p.y > 360) { s.got = 1; L.seedN++; G.seeds++; sSeed(); burst(s.x, s.y, '#8bc34a', 10); ft('+1 semente', s.x, s.y - 20, '#c5e1a5') }
            let hint = null;
            for (const l of L.leaks) { if (!l.f) { l.tm -= dt; if (l.tm <= 0) { l.tm = .12; P.push({ x: l.x + 22, y: 385, vx: 20, vy: 0, l: .9, m: .9, c: '#4fc3f7', g: 500, r: 3 }) } if (near(l.x, 50)) hint = kAct + ' para fechar vazamento'; if (near(l.x, 50) && press('a')) { l.f = 1; L.fixed++; G.leaks++; sFix(); burst(l.x, 400, '#4fc3f7', 16); ft('Vazamento fechado!', l.x, 360, '#81d4fa') } } }
            for (const s of L.spots) if (!s.d && near(s.x, 45)) { if (L.seedN > 0) { hint = kAct + ' para plantar semente'; if (press('a')) { s.d = 1; L.seedN--; L.planted++; G.trees++; L.trees.push({ x: s.x, g: 0 }); sPlant(); burst(s.x, 440, '#66bb6a', 20); ft('Árvore plantada!', s.x, 330, '#a5d6a7') } } else hint = 'Colete sementes 🌰' }
            L.hint = hint; let sh = 0; for (const t of L.trees) { t.g = Math.min(1, t.g + dt * .9); if (Math.abs(p.x + 14 - t.x) < 150 * t.g) sh = 1 }
            if (sh && !L.shade) { sCool(); ft('Temperatura reduzida!', p.x + 14, p.y - 20, '#80deea') } L.shade = sh;
            p.heat = Math.max(0, Math.min(100, p.heat + (sh ? -20 : 5) * dt)); if (sh && Math.random() < .3) P.push({ x: p.x + 14 + (Math.random() - .5) * 30, y: p.y + 30, vx: 0, vy: -60, l: .7, m: .7, c: '#80deea', g: 0, r: 3 });
            updFx(dt); if (L.planted >= 5 && L.fixed >= 4 && !L.win) L.win = 1.4; if (L.win) { L.win -= dt; if (L.win <= 0) { card = 0; go('card') } }
        }
        function draw1() {
            const t = L.t, g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#ff8a2b'); g.addColorStop(.6, '#ffd27a'); g.addColorStop(1, '#f9e6b3'); X.fillStyle = g; X.fillRect(0, 0, W, H);
            X.fillStyle = '#fff3b0'; X.beginPath(); X.arc(790, 100, 48 + Math.sin(t * 2) * 3, 0, 7); X.fill(); X.strokeStyle = '#fff3b0'; X.lineWidth = 5; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6 + t * .3; X.beginPath(); X.moveTo(790 + Math.cos(a) * 62, 100 + Math.sin(a) * 62); X.lineTo(790 + Math.cos(a) * 88, 100 + Math.sin(a) * 88); X.stroke() }
            X.fillStyle = '#d98a4a'; X.beginPath(); X.moveTo(0, 460); for (let i = 0; i <= 8; i++)X.lineTo(i * 160 - (L.cx * .3 % 160), i % 2 ? 340 : 400); X.lineTo(W + 200, 460); X.fill();
            X.strokeStyle = '#fff6'; X.lineWidth = 2; for (let i = 0; i < 4; i++) { X.beginPath(); for (let x = 0; x <= W; x += 20)X.lineTo(x, 430 + i * 8 + Math.sin(x / 30 + t * 3 + i) * 3); X.stroke() }
            X.save(); X.translate(-L.cx, 0); X.fillStyle = '#c68642'; X.fillRect(0, 460, L.w, 80); X.fillStyle = '#a8692c'; X.fillRect(0, 460, L.w, 6); X.strokeStyle = '#8a5522'; X.lineWidth = 2; for (let x = 20; x < L.w; x += 75) { X.beginPath(); X.moveTo(x, 480); X.lineTo(x + 18, 495); X.lineTo(x + 4, 520); X.stroke() }
            for (const x of [200, 560, 1000, 1400, 1850, 2400]) { X.strokeStyle = '#6d4c2a'; X.lineWidth = 8; X.beginPath(); X.moveTo(x, 460); X.lineTo(x, 380); X.moveTo(x, 410); X.lineTo(x + 28, 380); X.moveTo(x, 395); X.lineTo(x - 24, 368); X.stroke() }
            for (const s of L.spots) if (!s.d) {
                X.setLineDash([8, 6]); X.strokeStyle = '#fff6'; X.lineWidth = 3; X.beginPath(); X.ellipse(s.x, 460, 38, 9, 0, 0, 7); X.stroke(); X.setLineDash([]);
                const oy = Math.sin(t * 4 + s.x) * 3; shadow(s.x, 460, oy, 16); txt('🌱', s.x, 445 + oy, 24);
            }
            for (const l of L.leaks) {
                const gL = X.createLinearGradient(l.x, 0, l.x + 40, 0); gL.addColorStop(0, '#7f8c8d'); gL.addColorStop(.5, '#bdc3c7'); gL.addColorStop(1, '#7f8c8d');
                X.fillStyle = gL; X.fillRect(l.x, 400, 16, 60); X.strokeStyle = '#0008'; X.lineWidth = 2; X.strokeRect(l.x, 400, 16, 60);
                X.fillRect(l.x, 400, 40, 14); X.strokeRect(l.x, 400, 40, 14);
                X.fillStyle = '#95a5a6'; X.fillRect(l.x + 30, 408, 14, 14); X.strokeRect(l.x + 30, 408, 14, 14);
                if (l.f) { txt('✅', l.x + 8, 375, 26) }
                else { X.fillStyle = '#4fc3f755'; X.beginPath(); X.ellipse(l.x + 28, 458, 18 + Math.sin(t * 3) * 3, 5, 0, 0, 7); X.fill(); txt('💧', l.x + 8, 372 + Math.sin(t * 5) * 3, 24) }
            }
            for (const tr of L.trees) {
                const gg = tr.g, e = 1 - Math.pow(1 - gg, 3), r = 150 * e; X.fillStyle = 'rgba(0,70,90,.2)'; X.beginPath(); X.ellipse(tr.x, 460, r, Math.max(1, 75 * e), 0, Math.PI, 0); X.fill(); X.strokeStyle = '#80deea'; X.lineWidth = 3; X.setLineDash([10, 8]); X.stroke(); X.setLineDash([]); X.fillStyle = 'rgba(0,40,60,.18)'; X.beginPath(); X.ellipse(tr.x, 462, r, 10 * e, 0, 0, 7); X.fill()
                const sw = Math.sin(t * 2 + tr.x) * 3 * e;
                const gT = X.createLinearGradient(tr.x - 8 * e, 0, tr.x + 8 * e, 0); gT.addColorStop(0, '#5d4037'); gT.addColorStop(.5, '#8d6e63'); gT.addColorStop(1, '#5d4037');
                X.fillStyle = gT; X.fillRect(tr.x - 8 * e, 460 - 95 * e, 16 * e, 95 * e); X.strokeStyle = '#0008'; X.lineWidth = 2; X.strokeRect(tr.x - 8 * e, 460 - 95 * e, 16 * e, 95 * e);
                X.fillStyle = '#2e9e4f'; for (const [dx, dy, rad] of [[-28, -100, 38], [28, -100, 38], [0, -130, 46]]) { X.beginPath(); X.arc(tr.x + dx * e + sw, 460 + dy * e, rad * e, 0, 7); X.fill(); X.stroke() }
                X.fillStyle = '#43c463'; X.beginPath(); X.arc(tr.x + sw, 460 - 135 * e, 30 * e, 0, 7); X.fill(); X.stroke()
            }
            for (const s of L.seeds) if (!s.got) {
                const oy = Math.sin(t * 4 + s.x) * 4; shadow(s.x, s.y, oy, 12); const y = s.y - 10 + oy;
                X.fillStyle = '#fff6'; X.beginPath(); X.arc(s.x, y, 17, 0, 7); X.fill(); X.fillStyle = '#6d4c2a'; X.beginPath(); X.ellipse(s.x, y + 3, 9, 6, 0, 0, 7); X.fill(); X.stroke(); X.fillStyle = '#4caf50'; X.beginPath(); X.ellipse(s.x + 3, y - 6, 6, 3, -.7, 0, 7); X.fill(); X.stroke()
            }
            drawP(L.p, t); if (L.hint) txt(L.hint, L.p.x + 14, L.p.y - 34, 18, '#fff'); drawFx(); X.restore();
            const h = L.p.heat / 100; bar(20, 14, 300, h, h > .7 ? '#e53935' : h > .4 ? '#fb8c00' : '#43a047', 'Calor ' + Math.round(h * 100) + '%', '🌡️'); chip(335, 10, 150, '🌰 Sementes: ' + L.seedN); chip(500, 10, 150, '💧 Vazamentos: ' + L.fixed + '/4'); chip(665, 10, 150, '🌳 Árvores: ' + L.planted + '/5');
            if (h >= 1) txt('Muito calor! Procure uma sombra 🌳', W / 2, 70, 24, '#ff5252');
            txt('Objetivo: plante 5 árvores e feche 4 vazamentos', W / 2, 515, 18, '#fff')
        }

        /* ---------- FASE 2 ---------- */
        function init2() {
            P = []; FT = [];
            L = {
                n: 2, w: 2000, cx: 0, t: 0, p: { x: 60, y: 424, vx: 0, vy: 0, on: 1, d: 1, carry: 0 }, lvl: 30, flash: 0, nf: 5, over: 0, win: 0,
                plats: [[250, 380, 120], [460, 320, 120], [700, 375, 140], [960, 330, 130], [1200, 375, 140], [1450, 320, 120], [1700, 375, 120]].map(a => ({ x: a[0], y: a[1], w: a[2] })),
                trash: [[300, 380], [500, 320], [420, 460], [740, 375], [1000, 330], [1240, 375]].map(a => ({ x: a[0] + 10, y: a[1], got: 0 })),
                drains: [620, 1120, 1620].map(x => ({ x, o: 0, n: 0 })), gardens: [880, 1400].map(x => ({ x, a: 0 })), clouds: Array.from({ length: 8 }, (_, i) => ({ x: i * 260, y: 20 + (i % 3) * 30 }))
            }; go('p2')
        }
        function upd2(dt) {
            const p = L.p, wl = 20 + L.lvl * 1.15; L.t += dt; if (L.over || L.win) { L.win && (L.win -= dt, L.win <= 0 && (card = 1, go('card'))); if (L.over && press('a')) init2(); updFx(dt); return }
            phys(p, dt, L.plats, p.y + 36 > 540 - wl + 8 ? 150 : 230);
            for (const s of L.trash) if (!s.got && near(s.x, 28) && Math.abs(p.y + 18 - s.y) < 34) { s.got = 1; p.carry++; G.trash++; sSeed(); burst(s.x, s.y, '#ffb74d', 8); ft('Lixo recolhido!', s.x, s.y - 20, '#ffe082') }
            let hint = null; for (const d of L.drains) if (!d.o && near(d.x, 60)) { if (p.carry >= 2) { hint = kAct + ' para desobstruir bueiro'; if (press('a')) { p.carry -= 2; d.o = 1; G.drains++; L.lvl = Math.max(0, L.lvl - 8); sFix(); burst(d.x, 455, '#4fc3f7', 20); ft('Bueiro livre! Água escoando', d.x, 380, '#81d4fa') } } else hint = 'Leve 2 lixos 🗑️ ao bueiro (' + p.carry + '/2)' }
            const od = L.drains.filter(d => d.o).length; for (const g of L.gardens) if (!g.a && near(g.x, 70)) { if (od > 0) { hint = kAct + ' para direcionar água ao jardim'; if (press('a')) { g.a = 1; G.gardens++; L.lvl = Math.max(0, L.lvl - 10); sPlant(); burst(g.x, 445, '#66bb6a', 20); ft('Jardim de chuva ativado!', g.x, 380, '#a5d6a7') } } else hint = 'Desobstrua um bueiro primeiro' }

        function drawCard() {
            const k = card; X.fillStyle = k == 0 ? '#c0732a' : k == 1 ? '#455a64' : '#2c3e50'; X.fillRect(0, 0, W, H); rr(150, 30, 660, 480, 28, '#fffdf5', '#ffd54f', 4); X.save(); X.beginPath(); X.roundRect(180, 50, 600, 130, 18); X.clip();
            if (k == 0) { const g = X.createLinearGradient(0, 50, 0, 180); g.addColorStop(0, '#ff9a3c'); g.addColorStop(1, '#ffe0a0'); X.fillStyle = g; X.fillRect(180, 50, 600, 130); X.fillStyle = '#fff3b0'; X.beginPath(); X.arc(700, 100, 34, 0, 7); X.fill(); X.fillStyle = '#c68642'; X.fillRect(180, 150, 600, 40); X.fillStyle = 'rgba(0,70,90,.25)'; X.beginPath(); X.ellipse(480, 160, 150, 40, 0, Math.PI, 0); X.fill(); const gT = X.createLinearGradient(464, 0, 488, 0); gT.addColorStop(0, '#5d4037'); gT.addColorStop(.5, '#8d6e63'); gT.addColorStop(1, '#5d4037'); X.fillStyle = gT; X.fillRect(472, 90, 16, 70); X.strokeStyle = '#0008'; X.lineWidth = 2; X.strokeRect(472, 90, 16, 70); X.fillStyle = '#2e9e4f'; for (const [x, y, r] of [[450, 90, 28], [510, 90, 28], [480, 60, 34]]) { X.beginPath(); X.arc(x, y, r, 0, 7); X.fill(); X.stroke(); } txt('🌡️ ↓', 300, 100, 40, '#fff', null) }
            else if (k == 1) { const g = X.createLinearGradient(0, 50, 0, 180); g.addColorStop(0, '#455a64'); g.addColorStop(1, '#90a4ae'); X.fillStyle = g; X.fillRect(180, 50, 600, 130); X.fillStyle = '#37474f'; for (const o of [0, 60, 120, 180]) X.beginPath(), X.arc(380 + o, 60, 40, 0, 7), X.fill(); X.strokeStyle = '#cfe8ff'; X.lineWidth = 2; for (let i = 0; i < 30; i++) { const x = 180 + (i * 53 + T * 100) % 600, y = 80 + (i * 71 + T * 400) % 100; X.beginPath(); X.moveTo(x, y); X.lineTo(x - 5, y + 14); X.stroke() } X.fillStyle = '#455a64'; X.fillRect(180, 150, 600, 40); X.fillStyle = '#2e9e4f'; X.beginPath(); X.ellipse(620, 160, 110, 30, 0, Math.PI, 0); X.fill(); X.strokeStyle = '#0008'; X.stroke(); for (let i = -2; i <= 2; i++)txt('🌷', 620 + i * 30, 140, 26, '#fff', null); X.strokeStyle = '#4fc3f7'; X.lineWidth = 6; X.setLineDash([14, 10]); X.lineDashOffset = -T * 60; X.beginPath(); X.moveTo(220, 150); X.lineTo(520, 150); X.stroke(); X.setLineDash([]); txt('💧➡️', 460, 130, 34, '#fff', null) }
            else { const g = X.createLinearGradient(0, 50, 0, 180); g.addColorStop(0, '#5d6d7e'); g.addColorStop(1, '#85929e'); X.fillStyle = g; X.fillRect(180, 50, 600, 130); X.fillStyle = '#4e342e'; X.beginPath(); X.moveTo(180, 180); X.lineTo(180, 80); X.lineTo(400, 150); X.lineTo(780, 150); X.lineTo(780, 180); X.fill(); X.fillStyle = '#33691e'; X.beginPath(); X.ellipse(280, 120, 40, 15, -.5, 0, 7); X.fill(); txt('🌿', 280, 115, 26, '#fff', null); const gL = X.createLinearGradient(430, 0, 470, 0); gL.addColorStop(0, '#1565c0'); gL.addColorStop(.5, '#42a5f5'); gL.addColorStop(1, '#1565c0'); rr(450, 90, 40, 60, 6, gL, '#0008', 2); txt('🛢️', 470, 120, 30, '#fff', null); }
            X.restore(); txt('VOCÊ SABIA?', W / 2, 215, 32, '#e67e22', 'center', '#fff'); wrap(CARDS[k][0], W / 2, 260, 560, 17, '#1b2a38', 24);
            btn('Continuar', 350, 435, 260, 56, () => { if (k == 0) init2(); else if (k == 1) init3(); else go('end') })
        }
        function drawEnd() {
            const g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#26c6da'); g.addColorStop(1, '#66bb6a'); X.fillStyle = g; X.fillRect(0, 0, W, H); for (let i = 0; i < 40; i++) { X.fillStyle = ['#ffd54f', '#ef5350', '#fff', '#7e57c2'][i % 4]; X.fillRect((i * 97) % W, (i * 61 + T * 90) % H, 8, 12) }
            rr(150, 30, 660, 480, 28, '#0a1a2ae6', '#ffd54f', 4); txt('Parabéns, Guardião do Clima!', W / 2, 70, 34, '#ffd54f'); drawP({ x: W / 2 - 14, y: 100 + Math.sin(T * 5) * 5, vx: 0, vy: 0, on: 0, d: 1, carry: 0 }, T);
            [['🌰 Sementes coletadas', G.seeds], ['💧 Vazamentos corrigidos', G.leaks], ['🌳 Árvores plantadas', G.trees], ['🥤 Lixo plástico recolhido', G.trash], ['🕳️ Bueiros desobstruídos', G.drains], ['🌷 Jardins de chuva ativados', G.gardens], ['🌱 Barreiras nas encostas', G.barriers], ['🛢️ Cisternas conectadas', G.cisterns]].forEach((r, i) => { txt(r[0], 260, 150 + i * 28, 18, '#fff', 'left', null); txt(String(r[1]), 700, 150 + i * 28, 20, '#ffd54f', 'right', null) });
            wrap('Ações de preservação ambiental reduzem vulnerabilidades aos impactos climáticos.', W / 2, 385, 560, 17, '#fff', 24); btn('AVANÇAR', 330, 435, 300, 50, () => go('cert'), '#2980b9')
        }

        function drawCert() {
            const g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#f1c40f'); g.addColorStop(1, '#d35400'); X.fillStyle = g; X.fillRect(0, 0, W, H);
            rr(100, 30, 760, 480, 12, '#fff', '#f39c12', 4);

            X.fillStyle = '#e74c3c'; X.beginPath(); X.moveTo(740, 350); X.lineTo(710, 470); X.lineTo(740, 440); X.lineTo(770, 470); X.fill();
            X.fillStyle = '#f1c40f'; X.beginPath(); X.arc(740, 350, 48, 0, 7); X.fill();
            X.strokeStyle = '#d35400'; X.lineWidth = 4; X.beginPath(); X.arc(740, 350, 40, 0, 7); X.stroke();
            txt('SELO', 740, 340, 20, '#d35400', 'center', null); txt('OFICIAL', 740, 360, 16, '#d35400', 'center', null);

            txt('CERTIFICADO GUARDIÃO DO CLIMA', W / 2, 70, 30, '#c0392b');
            txt('Os 3 Mandamentos Práticos:', 140, 125, 22, '#2980b9', 'left', null);

            const m = ['1. PROTEGER A ÁGUA: Não desperdiçar e nunca jogar lixo nas ruas ou rios.', '2. PLANTAR O FUTURO: Cuidar das plantas e árvores para refrescar a cidade.', '3. ESPALHAR A MENSAGEM: Ensinar a família e amigos a preservar a natureza!'];
            m.forEach((s, i) => wrap(s, 140, 170 + i * 75, 520, 17, '#34495e', 24, 'left'));

            drawP({ x: 650, y: 190, on: 0, d: 1, vx: 0, carry: 0 }, T);

            btn('VOLTAR AO MENU', 330, 435, 300, 50, () => go('menu'), '#e67e22');
        }

        function update(dt) { updTouch(); T += dt; if (S == 'menu' && press('a')) { G = { seeds: 0, leaks: 0, trees: 0, trash: 0, drains: 0, gardens: 0, barriers: 0, cisterns: 0 }; introSlide = 0; go('intro'); } else if (S == 'how' && press('a')) go('menu'); else if (S == 'intro' && press('a')) { if (introSlide == 2) init1(); else introSlide++; } else if (S == 'card' && press('a')) { card == 0 ? init2() : card == 1 ? init3() : go('end') } else if (S == 'end' && press('a')) go('cert'); else if (S == 'cert' && press('a')) go('menu'); else if (S == 'p1') upd1(dt); else if (S == 'p2') upd2(dt); else if (S == 'p3') upd3(dt); }
        function render() { X.setLineDash([]); X.globalAlpha = 1; if (S == 'menu') drawMenu(); else if (S == 'intro') drawIntro(); else if (S == 'how') drawHow(); else if (S == 'card') drawCard(); else if (S == 'end') drawEnd(); else if (S == 'cert') drawCert(); else if (S == 'p1') draw1(); else if (S == 'p2') draw2(); else if (S == 'p3') draw3(); drawTouch(); }
        let last = 0; function loop(ts) { const dt = Math.min(.033, (ts - last) / 1000 || 0); last = ts; btns = []; update(dt); render(); if (fade > 0) { X.fillStyle = 'rgba(0,0,0,' + fade + ')'; X.fillRect(0, 0, W, H); fade = Math.max(0, fade - dt * 2.5) } pressed = {}; requestAnimationFrame(loop) }
        requestAnimationFrame(loop);
    </script>
</body>
